# ==============================================================================
# docker-compose.yml — WEG PLC500 + Node-RED + FastAPI ML + PostgreSQL Stack
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-plc500_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-plc500_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./node-red/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plc500_net

  ml-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ML_API_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
      ML_API_HOST: ${ML_API_HOST:-0.0.0.0}
      ML_API_PORT: "8000"
      ML_MODELS_DIR: /app/models
      ML_WINDOW_SECONDS: ${ML_WINDOW_SECONDS:-60}
      ML_BASELINE_MU: ${ML_BASELINE_MU:-12.0}
      ML_BASELINE_SIGMA: ${ML_BASELINE_SIGMA:-2.5}
      ML_ZSCORE_EPS: ${ML_ZSCORE_EPS:-0.01}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plc500_net

  node-red:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    ports:
      - "${NR_PORT:-1880}:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
      PLC_HOST: ${PLC_HOST:-192.168.10.10}
      PLC_PORT: ${PLC_PORT:-502}
      PLC_UNIT_ID: ${PLC_UNIT_ID:-1}
      UNIT_ID: ${UNIT_ID:-1}
      PLC_WATCHDOG_TIMEOUT_MS: ${PLC_WATCHDOG_TIMEOUT_MS:-5000}
      PLC_MODBUS_MAP_VERSION: ${PLC_MODBUS_MAP_VERSION:-100}
      PLC_SIM_API_URL: ${PLC_SIM_API_URL:-http://plc-simulator:8001}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-plc500_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-plc500_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ML_API_URL: ${ML_API_URL:-http://ml-api:8000}
      ML_WINDOW_SECONDS: ${ML_WINDOW_SECONDS:-60}
      ML_BASELINE_MU: ${ML_BASELINE_MU:-12.0}
      ML_BASELINE_SIGMA: ${ML_BASELINE_SIGMA:-2.5}
      ML_ZSCORE_EPS: ${ML_ZSCORE_EPS:-0.01}
      NR_PORT: "1880"
      NR_ADMIN_USER: ${NR_ADMIN_USER:-admin}
      NR_ADMIN_PASSWORD: ${NR_ADMIN_PASSWORD:-}
      NR_CREDENTIAL_SECRET: ${NR_CREDENTIAL_SECRET}
      NR_POLL_INTERVAL_MS: ${NR_POLL_INTERVAL_MS:-500}
      NR_ANALYSIS_INTERVAL_S: ${NR_ANALYSIS_INTERVAL_S:-60}
      NR_MODBUS_TIMEOUT_MS: ${NR_MODBUS_TIMEOUT_MS:-1500}
      NR_MODBUS_RECONNECT_MS: ${NR_MODBUS_RECONNECT_MS:-2000}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # Use named volume rather than bind-mounting ./node-red:/data so /data/node_modules is never masked.
    volumes:
      - nodered_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1880/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - plc500_net

  plc-simulator:
    profiles: ["sim"]
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "plc500_ml.plc_simulator"]
    ports:
      - "${PLC_SIM_HOST_PORT:-8502}:${PLC_SIM_PORT:-502}"
      - "${PLC_SIM_API_PORT:-8001}:${PLC_SIM_API_PORT:-8001}"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
      PLC_SIM_HOST: ${PLC_SIM_HOST:-0.0.0.0}
      PLC_SIM_PORT: ${PLC_SIM_PORT:-502}
      PLC_SIM_API_PORT: ${PLC_SIM_API_PORT:-8001}
      PLC_SIM_CONTROL_PORT: ${PLC_SIM_API_PORT:-8001}
      PLC_UNIT_ID: ${PLC_UNIT_ID:-1}
      PLC_WATCHDOG_TIMEOUT_MS: ${PLC_WATCHDOG_TIMEOUT_MS:-5000}
      PLC_MODBUS_MAP_VERSION: ${PLC_MODBUS_MAP_VERSION:-100}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; p=os.getenv('PLC_SIM_API_PORT','8001'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plc500_net

volumes:
  postgres_data:
  nodered_data:

networks:
  plc500_net:
    driver: bridge
