[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plc500-ml"
version = "1.0.0"
description = "ML inference, sliding-window feature engineering, safety rules, and Modbus TCP simulator for WEG PLC500"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Augusto Dantas", email = "augusto.p.dantas8@gmail.com" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "pymodbus>=3.6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
plc500-api = "plc500_ml.api:main"
plc500-sim = "plc500_ml.plc_simulator:main"
plc500-gen-data = "plc500_ml.data_generator:main"
plc500-train = "plc500_ml.train:main"

[tool.hatch.build.targets.wheel]
packages = ["plc500_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["plc500_ml", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["plc500_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
